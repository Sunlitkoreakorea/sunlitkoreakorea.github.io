<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunlit Korea — Projects</title>
<meta name="description" content="Sunlit Korea가 만들어 배포한 학습 도구, 유틸리티, 게임 모음">
<style>
  :root{
    --bg:#f7f6f3;
    --surface:#ffffff;
    --border:#e6e3dc;
    --text:#1c1a17;
    --muted:#6b6558;
    --accent:#b45309;
    --accent-soft:#fdf0e3;
    --shadow: 0 1px 2px rgba(28,26,23,0.04), 0 8px 24px rgba(28,26,23,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15130f;
      --surface:#1f1c17;
      --border:#332e26;
      --text:#f2ede4;
      --muted:#a89e8c;
      --accent:#e0975a;
      --accent-soft:#2b2118;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", Arial, sans-serif;
    padding: 64px 20px 80px;
  }
  .wrap{
    max-width: 880px;
    margin: 0 auto;
  }
  header{
    margin-bottom: 32px;
  }
  .eyebrow{
    display:inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  h1{
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.25;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  header p{
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin: 0;
    max-width: 60ch;
  }
  h2.section-title{
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    padding-top: 8px;
  }

  .search{
    position: relative;
    margin-bottom: 32px;
  }
  .search input{
    width: 100%;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 44px 13px 44px;
    box-shadow: var(--shadow);
  }
  .search input::placeholder{ color: var(--muted); }
  .search input:focus{ outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .search .ico{
    position: absolute;
    left: 15px;
    top: 15px;
    color: var(--muted);
    pointer-events: none;
  }
  .search .hint, .search .clear{
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
  }
  .search .hint{
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 7px;
    pointer-events: none;
  }
  .search .clear{
    font: inherit;
    font-size: 18px;
    line-height: 1;
    color: var(--muted);
    background: none;
    border: 0;
    border-radius: 6px;
    padding: 6px 9px;
    cursor: pointer;
  }
  .search .clear:hover{ color: var(--text); }
  @media (hover:none){ .search .hint{ display:none; } }

  .recent{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 32px;
  }
  .chip{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13.5px;
    color: inherit;
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
  }
  .chip:hover{ border-color: var(--accent); }

  .tiles{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 44px;
  }
  @media (max-width: 620px){
    .tiles{ grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }
  .tile{
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    font: inherit;
    color: inherit;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .15s ease, border-color .15s ease;
  }
  .tile:hover{ transform: translateY(-2px); border-color: var(--accent); }
  .tile.on{ border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
  .mono{
    flex-shrink: 0;
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 16px;
    font-weight: 700;
  }
  .tt{ flex: 1; min-width: 0; }
  .tt b{ display: block; font-size: 15.5px; font-weight: 700; line-height: 1.3; word-break: keep-all; }
  .dot{ position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .sr{ position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .tt small{ font-size: 12.5px; color: var(--muted); }
  @media (max-width: 620px){
    .tile{ padding: 12px; gap: 10px; }
    .mono{ width: 34px; height: 34px; font-size: 15px; }
  }

  .panel{
    grid-column: 1 / -1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 13px 18px;
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child{ border-bottom: 0; }
  .row:hover{ background: var(--accent-soft); }
  .rt{ min-width: 0; }
  .rn{ display: block; font-size: 15px; font-weight: 600; }
  .rd{ display: block; font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .rm{ display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .ty{
    font-size: 11.5px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    white-space: nowrap;
  }
  .nw{
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .arrow{ color: var(--muted); font-size: 16px; }
  @media (max-width: 620px){
    .row{ padding: 12px 14px; align-items: flex-start; }
    .rm{ flex-direction: column-reverse; align-items: flex-end; gap: 6px; }
    .arrow{ display: none; }
  }

  .count, .empty{
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .empty{ text-align: center; padding: 28px 0; font-size: 14px; }

  a:focus-visible, button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce){ .tile{ transition: none; } .tile:hover{ transform: none; } }

  footer{
    border-top: 1px solid var(--border);
    padding-top: 20px;
    font-size: 12.5px;
    color: var(--muted);
  }
  footer a{ color: var(--muted); }
  @media (max-width: 620px){
    .search{ position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; margin: -8px 0 20px; }
    .search .ico{ top: 23px; }
  }
</style>
</head>

  <div class="wrap">
    <header>

      <div class="recent" id="recent"></div>

      <h2 class="section-title">과목 · 도구 · 게임</h2>
      <div class="tiles" id="tiles"></div>

    <div id="results" hidden></div>

    <footer>

     detail:'대리석 기물이 놓인 3D 체스판에서 AI와 두는 체스: 캐슬링·앙파상·승진 등 전체 규칙, AI 5단계(입문~마스터)와 백/흑 선택, 무르기·힌트·기보, 시점 전환과 자유 회전'}
  ]}
];

var all = [];
S.forEach(function(s){
  s.it.forEach(function(it){
    it.f = it.f || it.t;
    it.isNew = now - Date.parse(it.added) <= NEW_DAYS * DAY;
    it.hay = [s.n, s.k, it.f, it.t, it.type, it.desc, it.en, it.detail].join(' ').toLowerCase();
    all.push(it);
  });
});

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function row(it, full){
  return '<a class="row" href="' + esc(it.url) + '"><span class="rt"><span class="rn">' + esc(full ? it.f : it.t) +
    '</span><span class="rd">' + esc(it.desc) + '</span></span><span class="rm">' +
    (it.isNew ? '<span class="nw">새로</span>' : '') +
    '<span class="ty">' + esc(it.type) + '</span><span class="arrow" aria-hidden="true">↗</span></span></a>';
}

var mq = window.matchMedia('(max-width: 620px)');
var openId = null;

function sync(){
  try { history.replaceState(null, '', openId ? '#' + openId : location.pathname + location.search); } catch(e){}
}

function fromHash(){
  var id = location.hash.slice(1);
  openId = S.some(function(s){ return s.id === id; }) ? id : null;
}

function render(){
  var cols = mq.matches ? 2 : 3, openIdx = -1, h = '';
  S.forEach(function(s, i){ if (s.id === openId) openIdx = i; });
  S.forEach(function(s, i){
    var on = s.id === openId;
    h += '<button type="button" class="tile' + (on ? ' on' : '') + '" data-id="' + s.id + '" aria-expanded="' + on + '"' +
      (on ? ' aria-controls="panel"' : '') + '><span class="mono" aria-hidden="true">' + s.m + '</span>' +
      '<span class="tt"><b>' + esc(s.n) + '</b><small>' + s.it.length + '개</small></span>' +
      (s.it.some(function(x){ return x.isNew; }) ? '<span class="dot" aria-hidden="true"></span><span class="sr">새 항목 있음</span>' : '') + '</button>';
    var rowEnd = (i + 1) % cols === 0 || i === S.length - 1;
    if (openIdx > -1 && rowEnd && Math.floor(openIdx / cols) === Math.floor(i / cols)){
      h += '<div class="panel" id="panel" role="region" aria-label="' + esc(S[openIdx].n) + ' 목록">' +
        S[openIdx].it.map(function(x){ return row(x, false); }).join('') + '</div>';
    }
  });
  $('tiles').innerHTML = h;
}

function recent(){
  var top = all.slice().sort(function(a, b){ return a.added < b.added ? 1 : a.added > b.added ? -1 : 0; }).slice(0, 3);
  $('recent').innerHTML = top.map(function(it){
    return '<a class="chip" href="' + esc(it.url) + '">' + esc(it.f) + (it.isNew ? '<span class="nw">새로</span>' : '') + '</a>';
  }).join('');
}

var inp = $('q');
function search(){
  var v = inp.value.trim().toLowerCase();
  $('clear').hidden = !inp.value;
  $('hint').hidden = !!inp.value;
  $('browse').hidden = !!v;
  $('results').hidden = !v;
  if (!v) return;
  var toks = v.split(/\s+/);
  var hit = all.filter(function(it){ return toks.every(function(t){ return it.hay.indexOf(t) > -1; }); });
  $('results').innerHTML = hit.length
    ? '<p class="count" role="status">' + hit.length + '개 찾았어요</p><div class="panel">' + hit.map(function(x){ return row(x, true); }).join('') + '</div>'
    : '<p class="empty" role="status">맞는 사이트가 없어요. 다른 단어로 찾아보세요.</p>';
}

$('tiles').addEventListener('click', function(e){
  var b = e.target.closest('.tile');
  if (!b) return;
  var id = b.dataset.id;
  openId = openId === id ? null : id;
  sync();
  render();
  var n = $('tiles').querySelector('.tile[data-id="' + id + '"]');
  if (n) n.focus({preventScroll: true});
  var p = $('panel');
  if (openId && p) p.scrollIntoView({block: 'nearest'});
});

inp.addEventListener('input', search);
inp.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && inp.value){ inp.value = ''; search(); }
});
$('clear').addEventListener('click', function(){ inp.value = ''; search(); inp.focus(); });
document.addEventListener('keydown', function(e){
  var t = e.target && e.target.tagName;
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && t !== 'INPUT' && t !== 'TEXTAREA'){
    e.preventDefault();
    inp.focus();
  }
});
window.addEventListener('hashchange', function(){ fromHash(); render(); });
if (mq.addEventListener) mq.addEventListener('change', render); else mq.addListener(render);

fromHash();
recent();
render();
search();
})();
</script>

</html>
